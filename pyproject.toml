[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanfae"
version = "0.1.0"
description = "Research prototype: KAN-based functional autoencoder for survival prediction from multivariate trajectories"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13",
  "pandas>=2.2,<3",            # lifelines 0.30.3 requires pandas<3.0
  "scikit-learn>=1.9,<1.10",   # scikit-survival 0.28.0 requires <1.10
  "torch==2.14.1",             # installed from the PyTorch CPU index (scripts/setup_env.sh)
  "lifelines==0.30.3",
  "scikit-survival==0.28.0",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "rdata>=0.11",               # reads CRAN .rda files (PBC, Stage G)
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "criterion(id): acceptance-criterion ID from docs/experiment_protocol.md section 7",
  "kind(k): DET (deterministic numerical) or STAT (random sample at a fixed seed)",
  "stage(s): pipeline stage A-G",
  "slow: long-running test",
]
