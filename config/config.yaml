# Central configuration for the ETH order-flow research pipeline.
# Paths are relative to the repository root unless absolute.
# ETHOF_DATA_DIR (environment variable) overrides data_dir.

data_dir: data                      # raw/ processed/ reports/ logs/ are created inside (git-ignored)

source:
  base_url: https://data.binance.vision/data/futures/um
  symbol: ETHUSDT
  market: USD-M perpetual futures

period:
  start: "2023-03-01"               # inclusive (UTC); chosen from bookDepth coverage, see docs/stage1
  end: "2026-09-30"                 # inclusive (UTC)

# Pre-registered split (Stage 1). Stage 2 does not use it, but it is recorded here so it cannot drift.
split:
  development_end: "2025-09-30"
  holdout_start: "2025-10-01"

datasets:
  # aggTrades: daily files (1,310 days, 25.3 GB zipped). Monthly files are also published, but a
  # single month (~33-50M rows) needs >13 GB RAM to process; daily files keep memory ~1 GB.
  aggTrades:   {granularity: daily,   enabled: true}
  fundingRate: {granularity: monthly, enabled: true}
  bookDepth:   {granularity: daily,   enabled: true}   # no monthly files are published
  metrics:     {granularity: daily,   enabled: true}   # open interest etc.; no monthly files

download:
  max_workers_small: 16             # parallel downloads for small daily files
  trade_workers: 4                  # parallel processes for daily trade files (download+clean+aggregate)
  retries: 4
  timeout_s: 300
  keep_raw_aggtrades: false         # ~25 GB zipped; deleted after verified processing (checksums kept in manifest)

quality:
  bad_tick_rel_dev: 0.02            # flag trades deviating >2% from their minute's median price (flag, never delete)
  extreme_bar_abs_logret: 0.03      # list 1-minute bars with |log return| > 3% for manual classification
  trade_gap_minutes: 2              # report runs of >= this many consecutive minutes without trades
  book_expected_snapshots_per_day: 2880
  book_short_day_ratio: 0.90        # day flagged "book_short_day" if snapshots < 90% of expected
  book_gap_seconds: 90              # report gaps between consecutive book snapshots longer than this
  book_stale_seconds: 120           # 1-min bar flagged if its as-of book snapshot is older than this

aggregation:
  bar: 1m
  # Absolute trade-size thresholds (ETH) for bucketed buy/sell volume. Fixed a priori; they let
  # Stage 3 build large-trade features with *trailing* thresholds without re-reading raw trades.
  size_buckets_eth: [1, 5, 10, 25, 50, 100, 250]

# ---------------------------------------------------------------------------------------------------
# Research design (Stage 3+). Fixed BEFORE any model or return-based result was computed.
research:
  primary_horizon: 15                 # minutes
  horizons: [5, 15, 30, 60]
  # 3-class neutral band = base round-trip cost (2 x ~5.5 bps per side), so NEUTRAL = "too small to trade"
  neutral_band: 0.0011
  walk_forward:
    start: "2023-03-01"
    first_validation: "2024-03-01"    # first 12 months = initial training window
    end_exclusive: "2025-10-01"       # = holdout start
    block_months: 3
    embargo_days: 1
    train_stride: 5                   # train on every 5th minute (overlapping labels are near-duplicates)
  holdout:
    start: "2025-10-01"
    end_exclusive: "2026-10-01"
  models:
    logit_C: 0.1
    rf: {n_estimators: 200, min_samples_leaf: 500, max_depth: 10, train_stride: 15}
    # restrained LightGBM grid, selected by mean validation log loss over walk-forward folds (set E, h = 15)
    lgbm_grid:
      num_leaves: [15, 63]
      min_child_samples: [500, 5000]
      n_estimators: [200, 600]
  signal:
    prob_deltas: [0.005, 0.01, 0.02, 0.03, 0.05]   # |P(up) - 0.5| > delta; delta chosen on development OOF only
    flow_rule_z: 1.0                  # simple order-flow rule: long if ofi_15_z_1440 > 1, short if < -1 (fixed a priori)
  costs:                              # per side, in bps of traded notional
    # Binance USD-M VIP0: maker 2.0 bps, taker 5.0 bps; 10% discount when fees are paid in BNB.
    # Orders execute at the next bar's VWAP as taker orders.
    low:  {fee_bps: 2.0, slippage_bps: 0.5}       # maker-level / high-VIP fees
    base: {fee_bps: 4.5, slippage_bps: 1.0}       # VIP0 taker with BNB discount
    high: {fee_bps: 5.0, slippage_bps: 2.0}       # VIP0 taker, no discount, extra slippage
    # half spread added to every scenario: measured from Binance bookTicker on 2023-06-14, 2023-11-15, 2024-03-13
    # (scripts/measure_spread.py -> reports/tables/spread_measurement.csv): spread = 1 tick 99.5% of seconds,
    # mean 0.046 bps -> half spread 0.023 bps
    half_spread_bps: 0.023
  regimes:
    vol_feature: vol_1440             # trailing 1-day realised volatility (known at t)
    cutoff_window_end: "2024-03-01"   # tercile cut-offs estimated on the initial training window only
